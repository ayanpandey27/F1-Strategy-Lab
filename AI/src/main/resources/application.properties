spring.application.name=f1-strategy-ai
server.port=8080

# --- H2 file database (stored in ./data, free, no server needed) ---
spring.datasource.url=jdbc:h2:file:./data/f1db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

# H2 web console: http://localhost:8080/h2-console (JDBC URL as above, user sa, empty password).
# Local access only; never enable this on a public server.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# --- Local LLM via Ollama (free, runs on this laptop) ---
spring.ai.ollama.base-url=http://localhost:11434
# llama3.2 (3B, ~2 GB) runs on most laptops. For better answers try qwen2.5:7b or llama3.1:8b.
spring.ai.ollama.chat.model=llama3.2
spring.ai.ollama.chat.temperature=0.2
spring.ai.ollama.chat.num-ctx=4096
# Fail fast when Ollama is down instead of Spring AI's default multi-minute backoff
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.max-interval=2s

# --- Jolpica F1 API (free, no key) ---
f1.jolpica.base-url=https://api.jolpi.ca/ergast/f1
f1.jolpica.request-delay-ms=350

# Frontend dev server origin
f1.cors.allowed-origins=http://localhost:4200
